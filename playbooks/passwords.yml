---
# Set local account passwords across the fleet.
#
#   ansible-playbook glueops.proxmox_evpn.passwords
#   ansible-playbook glueops.proxmox_evpn.passwords --limit hv37
#
# Both passwords are prompted for at runtime. Leave a prompt blank to skip that
# account, so you can rotate one without touching the other.
#
# Why prompts and not -e pw=...: anything passed with -e lands in your shell
# history and is visible in `ps` on the control node for the life of the run.
# Prompted values live only in memory.
#
# Set pve_admin_account in your inventory to name a second, non-root account to
# rotate alongside it. Leave it unset and only root is offered.
#
# Hashing happens on the control node — see the pve_passwords role.
- name: Set local account passwords across the fleet
  hosts: "{{ pve_fleet_group | default('pve_nodes') }}"
  gather_facts: false

  vars_prompt:
    - name: pve_pw_root
      prompt: "New password for 'root' (blank = skip)"
      private: true
      confirm: true
    - name: pve_pw_admin
      prompt: "New password for the account named by pve_admin_account (blank = skip)"
      private: true
      confirm: true

  tasks:
    - name: Build the list of accounts to update
      ansible.builtin.set_fact:
        pve_password_targets: >-
          {{ ([{'name': 'root', 'pw': pve_pw_root}]
              if (pve_pw_root | default('') | length) > 0 else [])
           + ([{'name': pve_admin_account, 'pw': pve_pw_admin}]
              if ((pve_admin_account | default('') | length) > 0
                  and (pve_pw_admin | default('') | length) > 0) else []) }}
      no_log: true

    - name: Refuse to run if nothing was supplied
      ansible.builtin.assert:
        that: pve_password_targets | length > 0
        fail_msg: >-
          No accounts to update. Both prompts were blank, or pve_admin_account
          is unset and the root prompt was blank.
      run_once: true

    - name: Apply the passwords
      ansible.builtin.include_role:
        name: glueops.proxmox_evpn.pve_passwords
