---
# Verify-only: cross-node reachability over the underlay.
#
#   ansible-playbook glueops.proxmox_evpn.link_check
#
# The underlay NIC is configured by the network play as part of the full
# interfaces rewrite. This exists so an operator can re-confirm reachability
# without re-running that.
- name: Verify cross-node connectivity over the private link
  hosts: "{{ pve_fleet_group | default('pve_nodes') }}"
  gather_facts: false
  tasks:
    - name: Ping each peer's link address
      ansible.builtin.command:
        cmd: ping -c 2 -W 2 {{ hostvars[item].pve_link_ip | split('/') | first }}
      loop: "{{ groups[pve_fleet_group | default('pve_nodes')] | difference([inventory_hostname]) }}"
      changed_when: false
