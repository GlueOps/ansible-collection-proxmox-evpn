description: >-
  Build and operate Proxmox VE hypervisor fleets with a BGP-EVPN / VXLAN tenant
  fabric driven by FRR. Host networking, per-VLAN VNI mapping, bridge FDB
  control, host firewall, config backup, monitoring and fleet patching.

