---
# Example inventory. Addresses are from the RFC 5737 documentation ranges —
# replace all of them.
#
# Everything here is per-host or per-fleet FACT. Behaviour is tuned in
# group_vars/pve_nodes.yml; the roles read both and nothing is hard-coded.
all:
  children:
    # The fleet group. Its name is configurable as pve_fleet_group, but every
    # playbook defaults to pve_nodes, so this is the path of least surprise.
    pve_nodes:
      vars:
        ansible_user: root
        # Public uplink NIC, and the VXLAN underlay NIC. Named per-fleet rather
        # than per-host because they are normally identical hardware — override
        # on a host that differs.
        pve_parent_iface: eno1
        pve_link_iface: eno2
        pve_public_prefix: 24
        pve_public_gateway: 198.51.100.1
        pve_bgp_asn: 65000

      hosts:
        hv01:
          ansible_host: 198.51.100.2
          pve_public_ip: 198.51.100.2
          pve_link_ip: 10.0.0.2/24
        hv02:
          ansible_host: 198.51.100.3
          pve_public_ip: 198.51.100.3
          pve_link_ip: 10.0.0.3/24
        hv03:
          ansible_host: 198.51.100.4
          pve_public_ip: 198.51.100.4
          pve_link_ip: 10.0.0.4/24
        hv04:
          ansible_host: 198.51.100.5
          pve_public_ip: 198.51.100.5
          pve_link_ip: 10.0.0.5/24
        hv05:
          ansible_host: 198.51.100.6
          pve_public_ip: 198.51.100.6
          pve_link_ip: 10.0.0.6/24

    # ----- Toggle groups. Membership controls behaviour; no code changes. -----

    # BGP route reflectors. Clients peer only with these. An EMPTY group means
    # full mesh between every host, which is fine up to a couple of dozen nodes.
    # Two reflectors, never one: the evpn playbook restarts them serially so a
    # client never loses every session at once, and that only works if there is
    # a second one to fall back to.
    pve_route_reflectors:
      hosts:
        hv01:
        hv02:

    # Hosts running a DHCP server for their guests. The firewall role drops
    # DHCP arriving on the public uplink of these hosts only.
    pve_dhcp_servers:
      hosts:
        hv01:
