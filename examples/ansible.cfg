# Example ansible.cfg for a private inventory repository that consumes this
# collection. Copy it there; it is not used by the collection itself.
#
# NO `inventory` IS SET HERE, DELIBERATELY.
#
# If you manage more than one fleet from one repository, a default inventory
# means a bare `ansible-playbook ...` silently targets whichever one this file
# happens to name. If both carry live workloads, "silently" is the dangerous
# part. With no inventory set, a bare run matches no hosts and does nothing
# instead of doing something to the wrong fleet. Select one explicitly:
#
#   ANSIBLE_CONFIG=ansible.prod.cfg ansible-playbook glueops.proxmox_evpn.evpn
#
# Ansible has no notion of named profiles WITHIN one config file. Section names
# are fixed component names ([defaults], [ssh_connection], ...); an invented
# [prod] section is parsed and silently discarded, there is no --profile flag,
# and every setting still comes from [defaults]. Profiles have to be separate
# files selected by ANSIBLE_CONFIG. Config files cannot include one another
# either, so a shared block has to be copied into each — keep them in sync.
#
# SSH keys are NOT set here. Put the key beside the inventory it belongs to, as
# `ansible_ssh_private_key_file` in that inventory's group_vars, so the key can
# never be mismatched to the fleet.
[defaults]
collections_path = ./collections
roles_path = ./roles
stdout_callback = default
result_format = yaml
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
